on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: native-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# `profile` goes to the three workflows it changes: quick skips the asan
# containers, valgrind and cran-special. lto, rchk and analyzers take minutes
# either way and run on every push. gctorture has its own caller,
# gctorture.yaml, with step 20 on a schedule.
jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      # As in R-CMD-check.yaml: duckdb and arrow as R-devel binaries, where
      # r-universe has them. The UBSan runners (Ubuntu 24.04) and gcc-asan
      # (Fedora) have none and build duckdb from source, about 55 minutes on
      # a cache miss, hence the timeout (roadmap Stage 9).
      pre-install: Rscript tools/ci-binaries.R
      timeout-minutes: 120
      env: |
        ZUARROW_FETCH_FIXTURES=true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  # valgrind.yml takes no env input, so the oracle tests skip here; the
  # crash corpus runs under ASan in sanitizers and in gctorture.yaml.
  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      # arrow's and duckdb's threads leave "possibly lost" TLS; see the file.
      suppressions: tools/valgrind.supp
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      # zukomp's codecs are not on CRAN yet; drop this once they are.
      github-packages: |
        pedrobtz/zukomp

  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
