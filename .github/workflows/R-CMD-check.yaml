on:
  push:
    branches: [main, master]
  # `labeled` so that adding `full-ci` to a pull request reruns it in full.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on each push to a pull request, full after merge. The
      # `full-ci` label runs the full set on a pull request before merging.
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
      # The default four legs plus Windows on R-devel, the combination CRAN's
      # own Windows R-devel check runs and nothing else here reaches. The
      # extra row runs in the full profile only.
      # The arrow-testing corpus of oracles 1 and 2 (design section 9),
      # fetched by the tests themselves (helper-fixtures.R).
      env: |
        ZUARROW_FETCH_FIXTURES=true
      # CRAN's NOSUGGESTS and NOLD flavours, in the full profile only. NOLD
      # is R without long double: the condition that made R parse 1e300
      # differently on arm64 macOS (Stage 8).
      nosuggests: true
      nold: true
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
