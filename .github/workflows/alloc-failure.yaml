on:
  # The sweep restarts R once per allocation, about 10,000 times, so it runs
  # weekly and on demand, `gh workflow run alloc-failure.yaml --ref <branch>`,
  # rather than on every pull request.
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

name: alloc-failure

permissions:
  contents: read

# Fails each allocation the workload makes after zuarrow is loaded, one per
# run: native memory held across an R allocation that can longjmp (#182).
# tools/alloc-exercise.R prints "alloc-exercise: <class vector>" before R
# stops on an error, and the patterns read that line.
#
# The figures are from a local run of r-actions' interposer in the r-hub
# ubuntu-release container, R 4.6.1, 2026-11-11: 22,635 allocations to load
# zuarrow, 32,621 with the workload, so about 10,000 to sweep at 0.25 s each.
# R_ENABLE_JIT=0 keeps the byte compiler, and its own crashes in grep(), out
# of the sweep and cuts it by a quarter; the baseline must set it too.
#
# #232 fixed the crashes: vendored nanoarrow and flatcc returned no error,
# or a bogus one, on a failed allocation (patches 0021 and 0022).
#
# expect-pattern: an injected failure must surface as the class design
# sections 8 and 6.8 give an allocation failure, a bare zuarrow_error or
# the writer's zuarrow_limit_error (#233), or as R's own allocation error,
# or bash's (Rscript runs R through a shell script). R's and bash's are
# matched by their wording, "cannot allocate vector", "... memory block",
# "... <n> bytes" and R's C helpers' "could not allocate" (deparse(),
# make.names(), order()), so a zuarrow message such as "cannot allocate
# the reader" under a wrong class is not accepted by its text.
# min-target-hits: 222 of the 323 sampled failures reached a zuarrow
# condition, so about 7,000 of the 10,000; 1000 catches a sweep that stopped
# reaching the package without depending on the exact count.
jobs:
  alloc-failure:
    uses: pedrobtz/r-actions/.github/workflows/alloc-failure.yml@v1
    with:
      run: R_ENABLE_JIT=0 Rscript tools/alloc-exercise.R
      baseline-run: R_ENABLE_JIT=0 Rscript -e 'suppressPackageStartupMessages(library(zuarrow))'
      max-allocations: 12000
      expect-pattern: "alloc-exercise: (zuarrow_limit_error/)?zuarrow_error/error/condition|cannot allocate (vector|memory block|[0-9]+ bytes)|[Cc]ould not allocate|memory exhausted|out of virtual memory"
      target-pattern: "alloc-exercise: zuarrow_"
      min-target-hits: 1000
      ignore-crash-pattern: "^ 1: (grepl?|sub|gsub|regexpr|gregexpr|strsplit|gzfile)\\("
      timeout-minutes: 150
