on:
  schedule:
    # Weekly. A new upstream release is not urgent.
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: vendor-upstream

jobs:
  upstream:
    # Pinned to a commit because this call holds a write token; bump it
    # deliberately, reading the diff.
    uses: pedrobtz/r-actions/.github/workflows/vendor-upstream.yml@8caf5119301bb2a3bd433b92045b8c75b3097096 # v1 (v1.24.0)
    permissions:
      contents: read
      issues: write
    with:
      upstream-repo: apache/arrow-nanoarrow
      current-version: sed -n 's/^TAG=//p' tools/derive-vendor
      # Releases only, not the release-candidate tags.
      tag-pattern: '^apache-arrow-nanoarrow-[0-9]+\.[0-9]+\.[0-9]+$'
