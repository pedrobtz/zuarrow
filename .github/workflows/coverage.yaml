on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# coverage.yml takes no env input, so ZUARROW_FETCH_FIXTURES cannot be
# set and the oracle tests skip: the coverage figure leaves out their paths.
jobs:
  coverage:
    # Pinned to a commit because this call holds a write token; bump it
    # deliberately, reading the diff.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@17264ce002a9359a492e0183852a555a5bb866e7 # v1.23.0
    permissions:
      contents: write
    with:
      # main requires pull requests, so the badge commit goes to gh-pages.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
